name: daily_ritual
description: "A personal daily companion — something to do, learn, laugh at and be surprised by, every day."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.9.0
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.2
  flutter_timezone: ^5.1.0
  go_router: ^18.0.0
  intl: ^0.20.3
  share_plus: ^13.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

flutter:
  uses-material-design: true

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-VariableFont_wght.ttf
